<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
  <title id="title">TouchBarChat workspace illustration</title>
  <desc id="description">Illustrative macOS workspace with a sidebar, local interview records, a rendered question and answer, and an icon-only start button. All content is fictional sample data, not a screenshot of a user's computer.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="0.58" stop-color="#15131D"/>
      <stop offset="1" stop-color="#0D1017"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ADA0C6" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="windowShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="60" y="110" width="1320" height="662" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1440" height="860" fill="url(#backdrop)"/>
  <rect width="1440" height="860" fill="url(#grid)"/>
  <ellipse cx="300" cy="122" rx="540" ry="310" fill="url(#ambient)"/>
  <ellipse cx="1350" cy="760" rx="460" ry="310" fill="url(#ambient)" opacity="0.65"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="53" fill="#C6B4FC" font-size="13" font-weight="700" letter-spacing="3">TOUCHBARCHAT / WORKSPACE</text>
    <text x="1380" y="53" fill="#8D8997" font-size="12" text-anchor="end" letter-spacing="1.6">ILLUSTRATIVE UI · SAMPLE CONTENT</text>

    <g filter="url(#windowShadow)">
      <rect x="60" y="110" width="1320" height="662" rx="20" fill="#1C1C1F" stroke="#49434F" stroke-width="1.5"/>
    </g>
    <g clip-path="url(#windowClip)">
      <rect x="60" y="110" width="1320" height="56" fill="#202025"/>
      <rect x="60" y="166" width="250" height="606" fill="#232328"/>
      <rect x="310" y="166" width="356" height="606" fill="#1F2024"/>
      <rect x="666" y="166" width="714" height="606" fill="#1C1C1F"/>
      <path d="M 60 166 H 1380 M 310 166 V 772 M 666 166 V 772" stroke="#3B3B43" stroke-width="1"/>

      <!-- Native-style chrome and an icon-only primary action. -->
      <circle cx="85" cy="138" r="7" fill="#FF5F57"/>
      <circle cx="107" cy="138" r="7" fill="#FEBC2E"/>
      <circle cx="129" cy="138" r="7" fill="#28C840"/>
      <text x="720" y="144" text-anchor="middle" fill="#A6A3AF" font-size="14" font-weight="600">TouchBarChat</text>
      <rect x="1295" y="121" width="48" height="34" rx="9" fill="#7044CC"/>
      <path d="M 1315 130 L 1315 146 L 1328 138 Z" fill="#FFFFFF"/>

      <!-- Sidebar: navigation and local-only privacy cue. -->
      <rect x="84" y="201" width="48" height="48" rx="12" fill="#352C49"/>
      <path d="M 97 225 v-4 m7 12 v-20 m7 25 v-30 m7 24 v-18" stroke="#B497FF" stroke-width="3" stroke-linecap="round"/>
      <text x="147" y="221" fill="#F5F4F8" font-size="18" font-weight="700">TouchBarChat</text>
      <text x="147" y="242" fill="#AAA8B1" font-size="13">Interview workspace</text>
      <text x="85" y="309" fill="#81808A" font-size="11" font-weight="700" letter-spacing="2">WORKSPACE</text>
      <rect x="76" y="329" width="218" height="46" rx="10" fill="#303036" stroke="#3B3B43"/>
      <path d="M 96 343 h13 v18 H96 Z M 109 343 h13 v18 h-13 M 111 347 h7 m-7 5 h7" fill="none" stroke="#C5AEF8" stroke-width="1.7" stroke-linejoin="round"/>
      <text x="136" y="358" fill="#F2F0F6" font-size="15" font-weight="600">Interview records</text>
      <circle cx="104" cy="402" r="9" fill="none" stroke="#A7A3B0" stroke-width="1.7"/>
      <circle cx="104" cy="402" r="3.2" fill="none" stroke="#A7A3B0" stroke-width="1.5"/>
      <path d="M 104 389 v4 M 104 411 v4 M 91 402 h4 M 113 402 h4 M 95 393 l3 3 M 110 408 l3 3 M 113 393 l-3 3 M 98 408 l-3 3" stroke="#A7A3B0" stroke-width="1.4"/>
      <text x="136" y="407" fill="#C4C2CB" font-size="15">Settings</text>
      <path d="M 91 706 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="#85818F" stroke-width="1.6"/>
      <rect x="87" y="706" width="24" height="20" rx="3" fill="none" stroke="#85818F" stroke-width="1.6"/>
      <text x="124" y="720" fill="#898793" font-size="12">Text stays on this Mac</text>

      <!-- Session list follows the three-column app layout. -->
      <text x="337" y="225" fill="#F3F2F6" font-size="22" font-weight="700">Interview records</text>
      <rect x="606" y="200" width="34" height="34" rx="8" fill="#303036"/>
      <path d="M 616 222 l9-9 M 617 214 v-1 h8 M 625 221 v-8" fill="none" stroke="#BBB8C1" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 338 274 l4 4 4-4" fill="none" stroke="#B8B5C0" stroke-width="1.6" stroke-linecap="round"/>
      <text x="355" y="279" fill="#DDDCE2" font-size="14" font-weight="600">Today</text>
      <text x="337" y="304" fill="#797783" font-size="11" letter-spacing="1">FICTIONAL EXAMPLES</text>
      <rect x="327" y="321" width="323" height="89" rx="10" fill="#352C49"/>
      <rect x="327" y="321" width="5" height="89" rx="3" fill="#B497FF"/>
      <text x="349" y="354" fill="#F4F1F8" font-size="15" font-weight="700">Product role · sample</text>
      <text x="620" y="354" fill="#B1AEB9" font-size="12" text-anchor="end">10:24</text>
      <text x="349" y="381" fill="#B8B2C4" font-size="13">How would you prioritize a feature?</text>
      <rect x="327" y="420" width="323" height="82" rx="10" fill="#25262B"/>
      <text x="349" y="452" fill="#E6E4EA" font-size="15" font-weight="600">Design role · sample</text>
      <text x="620" y="452" fill="#8F8D99" font-size="12" text-anchor="end">09:10</text>
      <text x="349" y="479" fill="#96949F" font-size="13">Tell me about a design trade-off...</text>

      <!-- Read-only Markdown rendering and compact icon toolbar. -->
      <rect x="1130" y="186" width="42" height="34" rx="8" fill="#352C49"/>
      <path d="M 1140 196 q10-4 12 2 q2-6 12-2 v14 q-10-4-12 2 q-2-6-12-2 Z" fill="none" stroke="#B497FF" stroke-width="1.6"/>
      <rect x="1179" y="186" width="42" height="34" rx="8" fill="#303036"/>
      <path d="M 1191 209 l3-9 10-10 5 5-10 10 Z" fill="none" stroke="#CCC9D1" stroke-width="1.7"/>
      <rect x="1228" y="186" width="42" height="34" rx="8" fill="#303036"/>
      <path d="M 1249 191 v17 m-6-11 6-6 6 6 M 1239 204 v8 h20 v-8" fill="none" stroke="#CCC9D1" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="1277" y="186" width="42" height="34" rx="8" fill="#303036"/>
      <path d="M 1288 204 l7-7 M 1288 198 v-1 h7 M 1298 208 l10-10 M 1301 198 h7 v7" fill="none" stroke="#CCC9D1" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="1326" y="186" width="42" height="34" rx="8" fill="#303036"/>
      <circle cx="1338" cy="203" r="1.6" fill="#CCC9D1"/>
      <circle cx="1347" cy="203" r="1.6" fill="#CCC9D1"/>
      <circle cx="1356" cy="203" r="1.6" fill="#CCC9D1"/>

      <text x="712" y="293" fill="#F5F4F8" font-size="29" font-weight="700">Product role · sample</text>
      <text x="712" y="320" fill="#9996A2" font-size="14">Sample session  ·  2 questions</text>
      <path d="M 712 349 H 1338" stroke="#3B3B43" stroke-width="1"/>

      <circle cx="733" cy="401" r="20" fill="#352C49"/>
      <text x="733" y="408" text-anchor="middle" fill="#E6D8FF" font-size="16" font-weight="700">1</text>
      <text x="770" y="391" fill="#F4F2F7" font-size="17" font-weight="700">Interviewer:</text>
      <text x="875" y="391" fill="#E1DEE6" font-size="17">How would you prioritize a new feature?</text>
      <text x="770" y="431" fill="#F4F2F7" font-size="17" font-weight="700">AI:</text>
      <text x="875" y="431" fill="#D0CDD7" font-size="17">Start with user impact and expected outcomes.</text>
      <text x="875" y="457" fill="#D0CDD7" font-size="17">Compare evidence, effort, and delivery risk.</text>
      <text x="875" y="483" fill="#D0CDD7" font-size="17">Explain the trade-off and how to validate it.</text>
      <path d="M 770 524 H 1338" stroke="#3B3B43" stroke-width="1"/>

      <circle cx="733" cy="579" r="20" fill="#352C49"/>
      <text x="733" y="586" text-anchor="middle" fill="#E6D8FF" font-size="16" font-weight="700">2</text>
      <text x="770" y="569" fill="#F4F2F7" font-size="17" font-weight="700">Interviewer:</text>
      <text x="875" y="569" fill="#E1DEE6" font-size="17">What would change your decision?</text>
      <text x="770" y="609" fill="#F4F2F7" font-size="17" font-weight="700">AI:</text>
      <text x="875" y="609" fill="#D0CDD7" font-size="17">A shift in user needs or a higher-risk dependency</text>
      <text x="875" y="635" fill="#D0CDD7" font-size="17">would make me reassess the order.</text>

      <path d="M 712 690 H 1338" stroke="#3B3B43" stroke-width="1"/>
      <text x="715" y="728" fill="#77747F" font-size="12">LOCAL MARKDOWN RECORD  /  EDIT AFTER SESSION  /  EXPORT .MD</text>
    </g>
    <text x="60" y="816" fill="#9D99A7" font-size="13">SWIFTUI / APPKIT · TEXT-FIRST, LOCAL-FIRST</text>
    <text x="1380" y="816" text-anchor="end" fill="#817D8B" font-size="12" letter-spacing="1">MAIN WINDOW / RECORD REVIEW</text>
  </g>
</svg>
